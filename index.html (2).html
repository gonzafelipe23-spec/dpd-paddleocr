<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>DPD · OCR.Space v31</title>
<style>
:root{
  --navy:#0b2d4d;--bg:#f4f7fb;--line:#dce5ee;--ok:#167a55;--warn:#e3a400;--err:#b83232;
  --okbg:#e7f8f0;--warnbg:#fff3c4;--muted:#64778b;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:var(--bg);color:#10243a}
header{background:var(--navy);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:21px}
header p{margin:5px 0 0;font-size:13px;opacity:.9}
main{max-width:760px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{padding:12px;border-radius:12px;border:1px solid var(--line);background:white;font-weight:800;color:var(--navy);font-size:15px}
.field.active{background:var(--navy);color:white}
.field.loading{background:var(--warnbg);color:#735400;border-color:#e3c251}
.field.loaded{background:var(--okbg);color:var(--ok);border-color:#87d1ae}
.camera{display:block;width:100%;padding:16px;border-radius:14px;background:var(--navy);color:#fff;text-align:center;font-weight:900;font-size:18px;margin-top:14px}
#cameraInput{display:none}
.status{margin-top:12px;padding:12px;border-radius:12px;background:#edf4fa;white-space:pre-wrap}
.status.ok{background:#eaf8f1;color:#126b4a}
.status.loading{background:#fff5d2;color:#6b5200}
.status.error{background:#fff0f0;color:#8f2828}
.preview{margin-top:12px;min-height:220px;background:#081521;border-radius:14px;display:grid;place-items:center;overflow:hidden}
.preview img{max-width:100%;max-height:440px;object-fit:contain}
.section{margin-top:14px}
.section label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
.section input,.section textarea{width:100%;border:1px solid #cdd9e5;border-radius:12px;padding:12px;font:inherit;background:#fff}
.section input{font-size:20px}
.section textarea{min-height:72px;resize:vertical}
.grid-results{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result-box{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbfdff}
.result-box .k{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.result-box .v{font-size:17px;font-weight:800;min-height:22px;word-break:break-word}
.modal{position:fixed;inset:0;background:rgba(4,14,24,.95);display:none;z-index:9999;grid-template-rows:auto 1fr auto}
.modal.open{display:grid}
.top{background:#fff;padding:11px 14px;font-weight:900}
.stage{min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
#cropCanvas{max-width:100%;max-height:100%;display:block;touch-action:none}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bottom button{min-height:52px;border:0;border-radius:12px;font-weight:900;font-size:15px}
.repeat{background:#eef3f8;color:var(--navy)}
.use{background:var(--navy);color:#fff}
.small{font-size:12px;color:var(--muted);margin-top:6px}
@media (max-width:560px){.grid-results{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>DPD · OCR.Space</h1>
  <p>V31 · 5 campos + avance automático</p>
</header>

<main>
<div class="card">
  <div class="fields">
    <button class="field active" data-field="numero" data-label="NÚMERO">NÚMERO</button>
    <button class="field" data-field="fecha" data-label="FECHA">FECHA</button>
    <button class="field" data-field="materia" data-label="MATERIA">MATERIA</button>
    <button class="field" data-field="proceso" data-label="PROCESO">PROCESO</button>
    <button class="field" data-field="tipo" data-label="TIPO">TIPO</button>
  </div>

  <label class="camera" for="cameraInput">USAR CÁMARA</label>
  <input id="cameraInput" type="file" accept="image/*" capture="environment">

  <div class="status" id="status">LISTO. Empieza con NÚMERO y toma la foto.</div>
  <div class="preview" id="preview"><span style="color:#fff">La foto/recorte aparecerá aquí</span></div>

  <div class="section">
    <label>Valores capturados</label>
    <div class="grid-results">
      <div class="result-box"><div class="k">NÚMERO</div><div class="v" id="result-numero">—</div></div>
      <div class="result-box"><div class="k">FECHA</div><div class="v" id="result-fecha">—</div></div>
      <div class="result-box"><div class="k">MATERIA</div><div class="v" id="result-materia">—</div></div>
      <div class="result-box"><div class="k">PROCESO</div><div class="v" id="result-proceso">—</div></div>
      <div class="result-box"><div class="k">TIPO</div><div class="v" id="result-tipo">—</div></div>
    </div>
    <div class="small">Al leer bien un campo, su botón queda verde con ✓ y pasa automáticamente al siguiente.</div>
  </div>

  <div class="section">
    <label>Último dato leído</label>
    <input id="ocrValue" placeholder="Aquí aparecerá el último dato detectado">
  </div>

  <div class="section">
    <label>Texto bruto OCR</label>
    <textarea id="ocrRaw" readonly></textarea>
  </div>
</div>
</main>

<div class="modal" id="cropModal">
  <div class="top">✂️ AJUSTA EL RECORTE</div>
  <div class="stage"><canvas id="cropCanvas"></canvas></div>
  <div class="bottom">
    <button class="repeat" id="repeatBtn" type="button">REPETIR FOTO</button>
    <button class="use" id="useBtn" type="button">USAR RECORTE</button>
  </div>
</div>

<script>
(function(){
  const endpoint='https://dpd-paddleocr.onrender.com/ocr';
  const fieldOrder=['numero','fecha','materia','proceso','tipo'];

  const input=document.getElementById('cameraInput');
  const status=document.getElementById('status');
  const preview=document.getElementById('preview');
  const modal=document.getElementById('cropModal');
  const canvas=document.getElementById('cropCanvas');
  const ctx=canvas.getContext('2d');
  const repeatBtn=document.getElementById('repeatBtn');
  const useBtn=document.getElementById('useBtn');
  const buttons=[...document.querySelectorAll('.field')];

  let currentField='numero', sourceImg=null, rect={x:0,y:0,w:0,h:0},
      dragging=false, dragMode='move', dragStart=null;

  function msg(t,cls=''){
    status.className='status'+(cls?' '+cls:'');
    status.textContent=t;
  }
  function getButton(field){ return buttons.find(b=>b.dataset.field===field); }
  function setActive(field){
    currentField=field;
    buttons.forEach(btn=>{
      btn.classList.remove('active');
      if(btn.dataset.field===field) btn.classList.add('active');
    });
  }
  function markLoading(field){
    const btn=getButton(field);
    btn.classList.remove('loaded','active');
    btn.classList.add('loading');
    btn.textContent='LEYENDO…';
  }
  function markLoaded(field){
    const btn=getButton(field);
    btn.classList.remove('loading','active');
    btn.classList.add('loaded');
    btn.textContent=btn.dataset.label+' ✓';
  }
  function advanceNext(fromField){
    const idx=fieldOrder.indexOf(fromField);
    for(let i=idx+1;i<fieldOrder.length;i++){
      const f=fieldOrder[i], btn=getButton(f);
      if(btn && !btn.classList.contains('loaded')){
        setActive(f);
        msg('✓ '+fromField.toUpperCase()+' listo. Ahora toma la foto de '+btn.dataset.label+'.','ok');
        return;
      }
    }
    msg('✓ Todos los campos fueron capturados.','ok');
  }

  buttons.forEach(btn=>btn.addEventListener('click',()=>{
    setActive(btn.dataset.field);
    msg('Campo seleccionado: '+btn.dataset.label+'. Toma la foto.');
  }));

  input.addEventListener('change',function(){
    const file=input.files&&input.files[0];
    if(!file){msg('No llegó ninguna foto al navegador.','error');return;}

    const reader=new FileReader();
    reader.onerror=()=>msg('ERROR: no pude abrir la foto.','error');
    reader.onload=function(){
      const im=new Image();
      im.onerror=()=>msg('ERROR: el navegador no pudo leer la imagen.','error');
      im.onload=function(){
        sourceImg=im;
        const maxW=Math.max(280,window.innerWidth-16);
        const maxH=Math.max(300,window.innerHeight-150);
        const scale=Math.min(maxW/im.naturalWidth,maxH/im.naturalHeight,1);
        canvas.width=Math.max(1,Math.round(im.naturalWidth*scale));
        canvas.height=Math.max(1,Math.round(im.naturalHeight*scale));

        const h=currentField==='materia'?.30:(currentField==='tipo'?.22:.18);
        rect={x:canvas.width*.08,y:canvas.height*.38,w:canvas.width*.84,h:Math.max(50,canvas.height*h)};
        if(rect.y+rect.h>canvas.height-5) rect.y=Math.max(5,canvas.height-rect.h-5);

        draw();
        modal.classList.add('open');
        msg('Foto cargada. Ajusta el recorte de '+getButton(currentField).dataset.label+'.');
      };
      im.src=reader.result;
    };
    reader.readAsDataURL(file);
  });

  function draw(){
    if(!sourceImg)return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(sourceImg,0,0,canvas.width,canvas.height);
    ctx.fillStyle='rgba(0,0,0,.5)';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const sx=rect.x*(sourceImg.naturalWidth/canvas.width),
          sy=rect.y*(sourceImg.naturalHeight/canvas.height),
          sw=rect.w*(sourceImg.naturalWidth/canvas.width),
          sh=rect.h*(sourceImg.naturalHeight/canvas.height);

    ctx.drawImage(sourceImg,sx,sy,sw,sh,rect.x,rect.y,rect.w,rect.h);
    ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.strokeRect(rect.x,rect.y,rect.w,rect.h);

    const s=14; ctx.fillStyle='#fff';
    [[rect.x,rect.y],[rect.x+rect.w,rect.y],[rect.x,rect.y+rect.h],[rect.x+rect.w,rect.y+rect.h]]
      .forEach(([x,y])=>ctx.fillRect(x-s/2,y-s/2,s,s));
  }

  function point(ev){
    const r=canvas.getBoundingClientRect(), p=ev.touches?ev.touches[0]:ev;
    return {x:(p.clientX-r.left)*(canvas.width/r.width),y:(p.clientY-r.top)*(canvas.height/r.height)};
  }
  function hit(p){
    const t=28, cs=[['nw',rect.x,rect.y],['ne',rect.x+rect.w,rect.y],['sw',rect.x,rect.y+rect.h],['se',rect.x+rect.w,rect.y+rect.h]];
    for(const [m,x,y] of cs) if(Math.abs(p.x-x)<=t&&Math.abs(p.y-y)<=t) return m;
    return (p.x>=rect.x&&p.x<=rect.x+rect.w&&p.y>=rect.y&&p.y<=rect.y+rect.h)?'move':'new';
  }
  function startDrag(ev){
    ev.preventDefault();
    const p=point(ev);
    dragging=true; dragMode=hit(p);
    dragStart={x:p.x,y:p.y,rx:rect.x,ry:rect.y,rw:rect.w,rh:rect.h};
    if(dragMode==='new'){
      rect={x:p.x,y:p.y,w:40,h:40};
      dragMode='se';
      dragStart={x:p.x,y:p.y,rx:p.x,ry:p.y,rw:40,rh:40};
    }
  }
  function moveDrag(ev){
    if(!dragging)return;
    ev.preventDefault();
    const p=point(ev), dx=p.x-dragStart.x, dy=p.y-dragStart.y;
    let r={x:dragStart.rx,y:dragStart.ry,w:dragStart.rw,h:dragStart.rh};

    if(dragMode==='move'){r.x+=dx;r.y+=dy}
    if(dragMode.includes('e'))r.w=Math.max(40,dragStart.rw+dx);
    if(dragMode.includes('s'))r.h=Math.max(40,dragStart.rh+dy);
    if(dragMode.includes('w')){r.x=dragStart.rx+dx;r.w=Math.max(40,dragStart.rw-dx)}
    if(dragMode.includes('n')){r.y=dragStart.ry+dy;r.h=Math.max(40,dragStart.rh-dy)}

    r.x=Math.max(0,Math.min(r.x,canvas.width-40));
    r.y=Math.max(0,Math.min(r.y,canvas.height-40));
    r.w=Math.min(r.w,canvas.width-r.x);
    r.h=Math.min(r.h,canvas.height-r.y);
    rect=r; draw();
  }
  function endDrag(){dragging=false}

  canvas.addEventListener('mousedown',startDrag);
  canvas.addEventListener('mousemove',moveDrag);
  window.addEventListener('mouseup',endDrag);
  canvas.addEventListener('touchstart',startDrag,{passive:false});
  canvas.addEventListener('touchmove',moveDrag,{passive:false});
  canvas.addEventListener('touchend',endDrag,{passive:false});

  repeatBtn.addEventListener('click',()=>{
    modal.classList.remove('open');
    sourceImg=null; input.value='';
    msg('Repite la foto de '+getButton(currentField).dataset.label+'.');
  });

  useBtn.addEventListener('click',async()=>{
    if(!sourceImg){msg('ERROR: no hay imagen cargada.','error');return;}

    const field=currentField;
    const sx=rect.x*(sourceImg.naturalWidth/canvas.width),
          sy=rect.y*(sourceImg.naturalHeight/canvas.height),
          sw=rect.w*(sourceImg.naturalWidth/canvas.width),
          sh=rect.h*(sourceImg.naturalHeight/canvas.height);

    const out=document.createElement('canvas');
    out.width=Math.max(1,Math.round(sw));
    out.height=Math.max(1,Math.round(sh));
    out.getContext('2d').drawImage(sourceImg,sx,sy,sw,sh,0,0,out.width,out.height);

    preview.innerHTML='';
    const result=document.createElement('img');
    result.src=out.toDataURL('image/jpeg',.95);
    preview.appendChild(result);

    modal.classList.remove('open');
    markLoading(field);
    msg('Enviando '+getButton(field).dataset.label+' a OCR.Space…','loading');

    try{
      const blob=await new Promise(resolve=>out.toBlob(resolve,'image/jpeg',.95));
      if(!blob) throw new Error('No pude crear el recorte.');

      const fd=new FormData();
      fd.append('image',blob,'recorte.jpg');
      fd.append('field',field);

      const response=await fetch(endpoint,{method:'POST',body:fd});
      const rawResponse=await response.text();

      let data;
      try{data=JSON.parse(rawResponse)}
      catch(_){throw new Error('El servidor devolvió: '+rawResponse.slice(0,180))}

      if(!response.ok||!data.ok) throw new Error(data.error||('Error HTTP '+response.status));

      document.getElementById('ocrValue').value=data.value||'';
      document.getElementById('ocrRaw').value=data.raw||'';
      document.getElementById('result-'+field).textContent=data.value||'—';

      markLoaded(field);
      advanceNext(field);
    }catch(err){
      const btn=getButton(field);
      btn.classList.remove('loading');
      btn.textContent=btn.dataset.label;
      setActive(field);
      msg('ERROR OCR: '+err.message,'error');
    }finally{
      input.value=''; sourceImg=null;
    }
  });
})();
</script>
</body>
</html>
